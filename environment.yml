name: ai-mof-course
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10

  # Core Scientific Computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Chemistry and Materials Science
  - ase>=3.22.0
  - pymatgen>=2023.5.0
  - mendeleev>=0.14.0

  # Visualization
  - plotly>=5.14.0
  - nglview>=3.0.0

  # Machine Learning
  - scikit-learn>=1.3.0
  - pytorch>=2.0.0
  - pytorch-cuda=11.8  # For GPU support, remove if CPU only
  - tensorflow>=2.13.0

  # RDKit (better via conda)
  - rdkit>=2023.3.1

  # File I/O
  - h5py>=3.8.0
  - netcdf4>=1.6.3

  # Jupyter
  - jupyter>=1.0.0
  - jupyterlab>=4.0.0
  - ipywidgets>=8.0.0

  # Utilities
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - joblib>=1.2.0

  # Pip-only packages
  - pip
  - pip:
    - py3Dmol>=2.0.0
    - mofid-cygwin>=0.1.0
    - openbabel-wheel>=3.1.1
